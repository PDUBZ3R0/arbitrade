
name: arbitrade

x-arb: &arb
  env_file: [.env]
  restart: unless-stopped
  # Both loops stop between ticks on SIGTERM; give a slow tick time to finish.
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  sonic:
    <<: *arb
    image: arbitrade:sonic
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: sonic } }
    environment:
      MODE: "live"
      RUN_HOT: 1
    volumes:
      - sonic-db:/app/db
      - sonic-log:/app/log

  gnosis:
    <<: *arb
    image: arbitrade:gnosis
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: gnosis } }
    environment:
      MODE: "live"
      RUN_HOT: 1
    volumes:
      - gnosis-db:/app/db
      - gnosis-log:/app/log

  hyperliquid:
    <<: *arb
    image: arbitrade:hyperliquid
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: hyperliquid } }
    environment:
      MODE: "live"
      RUN_HOT: 1
    volumes:
      - hyperliquid-db:/app/db
      - hyperliquid-log:/app/log

  monad:
    <<: *arb
    image: arbitrade:monad
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: monad } }
    environment:
      MODE: "live"
      RUN_HOT: 1
    volumes:
      - monad-db:/app/db
      - monad-log/:/app/log

  ink:
    <<: *arb
    image: arbitrade:ink
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: ink } }
    environment:
      MODE: "live"
      RUN_HOT: 1
    volumes:
      - ink-db:/app/db
      - ink-log:/app/log     

  robinhood:
    <<: *arb
    image: arbitrade:robinhood
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: robinhood } }
    environment:
      MODE: "live"
      RUN_HOT: 1
    volumes:
      - robinhood-db:/app/db
      - robinhood-log:/app/log
          
volumes:
  sonic-db:
  sonic-log:
  gnosis-db:
  gnosis-log:
  hyperliquid-db:
  hyperliquid-log:
  monad-db:
  monad-log:
  ink-db:
  ink-log:
  robinhood-db:
  robinhood-log: