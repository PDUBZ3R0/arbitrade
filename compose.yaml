
name: arbitrade

x-arb: &arb
  env_file: [.env]
  restart: unless-stopped
  # Both loops stop between ticks on SIGTERM; give a slow tick time to finish.
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  sonic:
    <<: *arb
    image: arbitrade:sonic
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: sonic } }
    environment:
      MODE: "live"
    volumes:
      - sonic-db:/app/db
      - sonic-log:/app/log

  gnosis:
    <<: *arb
    image: arbitrade:gnosis
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: gnosis } }
    environment:
      MODE: "live"
    volumes:
      - gnosis-db:/app/db
      - gnosis-log:/app/log

  hyperliquid:
    <<: *arb
    image: arbitrade:hyperliquid
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: hyperliquid } }
    environment:
      MODE: "live"
    volumes:
      - hyperliquid-db:/app/db
      - hyperliquid-log:/app/log

  ink:
    <<: *arb
    image: arbitrade:ink
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: ink } }
    environment:
      MODE: "live"
    volumes:
      - ink-db:/app/db
      - ink-log:/app/log      
volumes:
  sonic-db:
  sonic-log:
  gnosis-db:
  gnosis-log:
  hyperliquid-db:
  hyperliquid-log:
  ink-db:
  ink-log: