# -----------------------------------------------------------------------------
# One container per chain, each built from Containerfile with its own DB and
# conf baked in (see Containerfile for what that means), each with its own
# volumes, so a chain can be rebuilt / restarted / reset without touching the
# others. Works with `docker compose` and `podman compose`.
#
#   docker compose build                 # all chains (or: build base)
#   docker compose up -d                 # dry run: MODE=test
#   MODE=live docker compose up -d base  # one chain live (needs PRIVATE_KEY)
#   docker compose logs -f base          # [manual] / [hot] / [liq] lines
#   docker compose down                  # stop; volumes (the live DBs) are kept
#
# MODE: test simulates only, live broadcasts. Set per chain with BASE_MODE,
# OPTIMISM_MODE, ARBITRUM_MODE, else MODE, else test. Compose also reads these
# from .env in this directory, so `MODE=live` there flips every chain.
#
# Secrets (PRIVATE_KEY, *_RPC, GRAPH_API_KEY, ENVIO_API_TOKEN …) come from
# .env at run time via env_file — never baked into an image.
#
# Resetting a chain to the DB in its image (e.g. after a rebuild with a fresh
# host DB):  docker compose down base && docker volume rm arbitrade_base-db
#
# Adding a chain: copy a service block, change CHAIN / names / volumes. Mind
# memory: the hot loop holds the chain's triangle index in RAM (Polygon's is
# large — set mem_limit from `docker stats` once it has run).
#
# On AWS, add compose.aws.yaml to send logs to CloudWatch:
#   docker compose -f compose.yaml -f compose.aws.yaml up -d
# -----------------------------------------------------------------------------

name: arbitrade

x-arb: &arb
  env_file: [.env]
  restart: unless-stopped
  # Both loops stop between ticks on SIGTERM; give a slow tick time to finish.
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  base:
    <<: *arb
    image: arbitrade:base
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: base } }
    environment:
      MODE: ${BASE_MODE:-${MODE:-test}}
    volumes:
      - base-db:/app/db
      - base-log:/app/log

  optimism:
    <<: *arb
    image: arbitrade:optimism
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: optimism } }
    environment:
      MODE: ${OPTIMISM_MODE:-${MODE:-test}}
    volumes:
      - optimism-db:/app/db
      - optimism-log:/app/log

  arbitrum:
    <<: *arb
    image: arbitrade:arbitrum
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: arbitrum } }
    environment:
      MODE: ${ARBITRUM_MODE:-${MODE:-test}}
    volumes:
      - arbitrum-db:/app/db
      - arbitrum-log:/app/log

volumes:
  base-db:
  base-log:
  optimism-db:
  optimism-log:
  arbitrum-db:
  arbitrum-log:
