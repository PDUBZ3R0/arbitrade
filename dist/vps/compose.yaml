
name: arbitrade

x-arb: &arb
  env_file: [.env]
  restart: unless-stopped
  # Both loops stop between ticks on SIGTERM; give a slow tick time to finish.
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 50m
      max-file: "5"

services:
  sonic:
    <<: *arb
    image: sonic
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: sonic } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - sonic-db:/app/db
      - sonic-log:/app/log

  avalanche:
    <<: *arb
    image: avalanche
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: avalanche } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - avalanche-db:/app/db
      - avalanche-log:/app/log

  polygon:
    <<: *arb
    image: polygon
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: polygon } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - polygon-db:/app/db
      - polygon-log:/app/log

  gnosis:
    <<: *arb
    image: gnosis
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: gnosis } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - gnosis-db:/app/db
      - gnosis-log:/app/log

  hyperliquid:
    <<: *arb
    image: hyperliquid
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: hyperliquid } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - hyperliquid-db:/app/db
      - hyperliquid-log:/app/log

  monad:
    <<: *arb
    image: monad
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: monad } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - monad-db:/app/db
      - monad-log:/app/log

  ink:
    <<: *arb
    image: ink
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: ink } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - ink-db:/app/db
      - ink-log:/app/log     

  robinhood:
    <<: *arb
    image: robinhood
    build: { context: ., dockerfile: Containerfile, args: { CHAIN: robinhood } }
    environment:
      MODE: "live"
      RUNS: "liquidate"
    volumes:
      - robinhood-db:/app/db
      - robinhood-log:/app/log
          
volumes:
  sonic-db:
  sonic-log:
  avalanche-db:
  avalanche-log:
  polygon-db:
  polygon-log:
  gnosis-db:
  gnosis-log:
  hyperliquid-db:
  hyperliquid-log:
  monad-db:
  monad-log:
  ink-db:
  ink-log:
  robinhood-db:
  robinhood-log: